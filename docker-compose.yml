services:
  kas-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-acquisition-studio
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Persist projects: manifests, sources, keyframe snapshots, and exported skills
      - ./projects:/app/projects
      # Persist runtime queues and inbox for daemon automation
      - ./runtime:/app/runtime
      # Optional: Mount your local Obsidian vault to sync notes directly
      # - ~/Documents/ObsidianVault:/vault
    env_file:
      - path: /home/hardik/.hermes/.env
        required: false
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/projects"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
